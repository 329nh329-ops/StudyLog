services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: mysql+pymysql://studylog:studylog@db:3306/studylog
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
      COOKIE_SECURE: "false"
      TIMEZONE: Asia/Tokyo
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    command: --default-time-zone=+09:00
    environment:
      TZ: Asia/Tokyo
      MYSQL_DATABASE: studylog
      MYSQL_USER: studylog
      MYSQL_PASSWORD: studylog
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
